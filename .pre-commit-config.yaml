repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src
        language: system
        pass_filenames: false
